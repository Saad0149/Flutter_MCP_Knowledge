# .github/workflows/publish.yml
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC — this is what replaces NPM_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - run: npm test

      - run: npm publish
        # No NODE_AUTH_TOKEN needed — npm CLI automatically detects the
        # OIDC context and authenticates via the trusted publisher
        # relationship configured in Step 1.
